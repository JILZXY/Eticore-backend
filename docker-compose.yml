name: eticore

services:
  db:
    image: postgres:18.6
    container_name: eticore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - eticore_pgdata:/var/lib/postgresql/data
    networks:
      - eticore_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      target: runtime
    profiles:
      - migrate
    restart: "no"
    env_file:
      - .env
    command: ["npm", "run", "migration:run"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eticore_net

  api:
    build:
      context: .
      target: runtime
    container_name: eticore-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${ETICORE_API_HOST_PORT:-3100}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eticore_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  eticore_net:
    name: eticore_net
    driver: bridge

volumes:
  eticore_pgdata:
    name: eticore_pgdata
